[project]
name = "nordic-ai-policy-tracker"
version = "0.1.0"
description = "Reproducible collection, processing, and analysis of Nordic university generative AI policy documents (pilot)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patricia Cruz" }]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "pandas>=2.1",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "spacy>=3.7",
    "langdetect>=1.0.9",
    "bertopic>=0.16",
    "sentence-transformers>=2.5",
    "scikit-learn>=1.4",
    "plotly>=5.19",
    "streamlit>=1.32",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.1",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # UP042: `class X(str, Enum)` kept for pydantic/JSON-serialization compatibility

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
